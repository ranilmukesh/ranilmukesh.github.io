<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .block-io { fill: #334155; stroke: #475569; stroke-width: 1.5; rx: 8px; }
      .block-prelude { fill: #1e293b; stroke: #3b82f6; stroke-width: 1.5; rx: 8px; }
      .block-recur { fill: #2e1065; stroke: #8b5cf6; stroke-width: 2; rx: 8px; }
      .block-coda { fill: #1e293b; stroke: #06b6d4; stroke-width: 1.5; rx: 8px; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .loop-arrow { stroke: #a855f7; stroke-width: 2.5; fill: none; stroke-dasharray: 6,4; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowhead-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="16" />

  <!-- Header -->
  <text x="400" y="38" text-anchor="middle" class="text-title">SMELT Stack Execution Trace</text>
  <text x="400" y="60" text-anchor="middle" class="text-subtitle">12 Physical Layers → 18 Executed Passes (Prelude-Recur-Coda Layout)</text>

  <!-- Input -->
  <g transform="translate(250, 85)">
    <rect width="300" height="34" class="block-io" />
    <text x="150" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Input Tokens &amp; Embedding</text>
  </g>
  <line x1="400" y1="119" x2="400" y2="135" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Prelude -->
  <g transform="translate(200, 135)">
    <rect width="400" height="60" class="block-prelude" />
    <text x="200" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#60a5fa">PRELUDE: Layers 1 .. 3 (Unshared)</text>
    <text x="200" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#93c5fd">Syntax Feature Extraction &amp; Positional Framing (r = 1, scale = 1.0x)</text>
  </g>
  <line x1="400" y1="195" x2="400" y2="215" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Recur Box -->
  <g transform="translate(160, 215)">
    <rect width="480" height="175" class="block-recur" />
    
    <!-- Pass 1 -->
    <rect x="25" y="20" width="430" height="58" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" />
    <text x="240" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f0abfc">RECUR (Pass 1): Middle 50% Layers 4 .. 9</text>
    <text x="240" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e879f9">First Representation Traversal (Sub-layer scale = 0.5x, 1/r)</text>

    <!-- Internal Loop Arrow -->
    <line x1="240" y1="78" x2="240" y2="98" class="arrow" marker-end="url(#arrowhead-purple)" />

    <!-- Pass 2 -->
    <rect x="25" y="98" width="430" height="58" rx="6" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5" />
    <text x="240" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f0abfc">RECUR (Pass 2): Tied Layers 4 .. 9</text>
    <text x="240" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e879f9">Iterative Reasoning &amp; Top-8 Expert Re-routing (Sub-layer scale = 0.5x)</text>

    <!-- Side Recurrence Loop Marker -->
    <path d="M 460 127 C 520 127 520 49 460 49" class="loop-arrow" marker-end="url(#arrowhead-purple)" />
    <text x="545" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Loop (r=2)</text>
  </g>
  <line x1="400" y1="390" x2="400" y2="410" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Coda -->
  <g transform="translate(200, 410)">
    <rect width="400" height="60" class="block-coda" />
    <text x="200" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#22d3ee">CODA: Layers 10 .. 12 (Unshared)</text>
    <text x="200" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#67e8f9">Output Vocabulary Projection &amp; Logit Calculation (r = 1, scale = 1.0x)</text>
  </g>
</svg>